openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Local-first job discovery and application tracking API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: dashboard
  - name: jobs
  - name: applications
  - name: candidate
  - name: search-profiles
  - name: cvs
  - name: agent
  - name: settings
  - name: discovery
  - name: integrations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/status:
    get:
      operationId: getAuthStatus
      tags: [auth]
      summary: Check local account setup and session status
      responses:
        "200":
          description: Current authentication state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
  /auth/setup:
    post:
      operationId: setupLocalAccount
      tags: [auth]
      summary: Create the first local account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthPasswordInput"
      responses:
        "200":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
        "409":
          description: An account already exists
  /auth/login:
    post:
      operationId: loginLocalAccount
      tags: [auth]
      summary: Sign in to the local account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthPasswordInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
        "401":
          description: Invalid password
  /auth/logout:
    post:
      operationId: logoutLocalAccount
      tags: [auth]
      summary: End the local session
      responses:
        "204":
          description: Signed out
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get live dashboard totals and recent activity
      responses:
        "200":
          description: Dashboard data from persisted records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List discovered and manually added jobs
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/JobStatus"
      responses:
        "200":
          description: Matching jobs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Job" }
    post:
      operationId: createJob
      tags: [jobs]
      summary: Add a real job record and reject exact duplicates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Job added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "409":
          description: Duplicate job fingerprint or source ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateJob"
  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { description: Job not found }
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update a job's review status
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
  /jobs/{id}/track:
    post:
      operationId: trackJobApplication
      tags: [applications]
      summary: Create a review-stage application record without submitting
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackApplicationInput"
      responses:
        "201":
          description: Application created in review state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "409":
          description: This job already has an application record
  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List tracked applications
      responses:
        "200":
          description: Application records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Application" }
  /candidate-profile:
    get:
      operationId: getCandidateProfile
      tags: [candidate]
      summary: Get the editable candidate profile
      responses:
        "200":
          description: Candidate profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateProfile" }
    put:
      operationId: saveCandidateProfile
      tags: [candidate]
      summary: Save verified candidate details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateProfileInput"
      responses:
        "200":
          description: Saved candidate profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateProfile" }
  /search-profiles:
    get:
      operationId: listSearchProfiles
      tags: [search-profiles]
      summary: List job search profiles
      responses:
        "200":
          description: Search profiles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SearchProfile" }
    post:
      operationId: createSearchProfile
      tags: [search-profiles]
      summary: Create a search profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchProfileInput"
      responses:
        "201":
          description: Created search profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchProfile" }
  /search-profiles/{id}:
    patch:
      operationId: updateSearchProfile
      tags: [search-profiles]
      summary: Update a search profile
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchProfileUpdate"
      responses:
        "200":
          description: Updated search profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchProfile" }
    delete:
      operationId: deleteSearchProfile
      tags: [search-profiles]
      summary: Delete a search profile
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Deleted }
  /cvs:
    get:
      operationId: listCvs
      tags: [cvs]
      summary: List locally stored CV metadata
      responses:
        "200":
          description: CVs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Cv" }
    post:
      operationId: uploadCv
      tags: [cvs]
      summary: Store a PDF or DOCX CV locally
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CvUploadInput" }
      responses:
        "201":
          description: CV stored locally
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cv" }
  /cvs/{id}:
    delete:
      operationId: deleteCv
      tags: [cvs]
      summary: Delete a CV file and its metadata
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Deleted }
  /cvs/{id}/parse:
    post:
      operationId: parseCvProfile
      tags: [cvs]
      summary: Extract a reviewable candidate-profile draft from a stored CV
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CvParseInput" }
      responses:
        "200":
          description: Candidate profile draft. No profile data is saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CvParseResult" }
        "400": { description: Invalid request or missing consent }
        "404": { description: CV not found }
        "409": { description: Provider is not configured }
        "422": { description: CV contains no extractable text }
  /settings/providers/{provider}:
    put:
      operationId: saveAiProvider
      tags: [settings]
      summary: Save an encrypted OpenAI or Gemini API configuration
      parameters:
        - $ref: "#/components/parameters/AiProvider"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiProviderConfigInput" }
      responses:
        "200":
          description: Provider configuration status, without the API key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderConnection" }
    delete:
      operationId: removeAiProvider
      tags: [settings]
      summary: Remove a saved AI provider configuration
      parameters:
        - $ref: "#/components/parameters/AiProvider"
      responses:
        "204": { description: Removed }
  /settings/providers/{provider}/test:
    post:
      operationId: testAiProvider
      tags: [settings]
      summary: Verify the configured API key and selected model
      parameters:
        - $ref: "#/components/parameters/AiProvider"
      responses:
        "200":
          description: Provider test result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderTestResult" }
        "409": { description: Provider is not configured }
  /settings/default-provider:
    patch:
      operationId: setDefaultAiProvider
      tags: [settings]
      summary: Set the preferred or default AI provider (auto, agentrouter, gemini, openai)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDefaultAiProviderInput"
      responses:
        "200":
          description: Default provider updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetDefaultAiProviderResult"
  /settings/gmail:
    put:
      operationId: saveGmailOAuthConfig
      tags: [settings]
      summary: Save encrypted Google OAuth client credentials
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GmailOAuthConfigInput" }
      responses:
        "200":
          description: Gmail setup status, without the client secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderConnection" }
    delete:
      operationId: disconnectGmail
      tags: [settings]
      summary: Revoke and remove the saved Gmail connection
      responses:
        "200":
          description: Local credentials were removed and Google revocation was attempted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GmailDisconnectResult" }
  /agent/status:
    get:
      operationId: getAgentStatus
      tags: [agent]
      summary: Get safe processing state
      responses:
        "200":
          description: Agent state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentStatus" }
  /agent/control:
    post:
      operationId: controlAgent
      tags: [agent]
      summary: Start, pause, resume, stop, or request a safe manual run
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentCommand" }
      responses:
        "200":
          description: Updated state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentStatus" }
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get integration connection status without exposing credentials
      responses:
        "200":
          description: Current settings state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsStatus" }
  /user/roles:
    get:
      operationId: getUserRoles
      tags: [discovery]
      summary: Get all role preferences for the user
      responses:
        "200":
          description: User role preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRolesResponse"
    post:
      operationId: addCustomRole
      tags: [discovery]
      summary: Add a custom role for discovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCustomRoleInput"
      responses:
        "200":
          description: Role added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolePreference"
  /user/roles/{roleId}:
    put:
      operationId: updateRolePreference
      tags: [discovery]
      summary: Update a role preference
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolePreferenceUpdate"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolePreference"
    delete:
      operationId: removeRolePreference
      tags: [discovery]
      summary: Remove a role preference
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Role removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoveRolePreferenceResult"
  /user/roles/{roleId}/enable:
    patch:
      operationId: toggleRoleEnabled
      tags: [discovery]
      summary: Enable or disable a role
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleRoleEnabledInput"
      responses:
        "200":
          description: Role toggle updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolePreference"
  /user/roles/{roleId}/priority:
    patch:
      operationId: setRolePriority
      tags: [discovery]
      summary: Set role priority level
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRolePriorityInput"
      responses:
        "200":
          description: Priority set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolePreference"
  /user/roles/{roleId}/weight:
    patch:
      operationId: setRoleWeight
      tags: [discovery]
      summary: Set role weight
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRoleWeightInput"
      responses:
        "200":
          description: Weight set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolePreference"
  /user/discovery-settings:
    get:
      operationId: getUserDiscoverySettings
      tags: [discovery]
      summary: Get user discovery settings
      responses:
        "200":
          description: Discovery settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverySettingsResponse"
    put:
      operationId: updateUserDiscoverySettings
      tags: [discovery]
      summary: Update discovery settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoverySettingsUpdate"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverySettings"
  /user/discovery-settings/search-frequency:
    patch:
      operationId: setSearchFrequency
      tags: [discovery]
      summary: Set search frequency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSearchFrequencyInput"
      responses:
        "200":
          description: Frequency set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverySettings"
  /discovery/run:
    post:
      operationId: runDiscovery
      tags: [discovery]
      summary: Run job discovery with CV guidance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunDiscoveryInput"
      responses:
        "200":
          description: Discovery results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResult"
  /discovery/history:
    get:
      operationId: getDiscoveryHistory
      tags: [discovery]
      summary: Get discovery history
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Discovery history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryHistory"
  /discovery/statistics:
    get:
      operationId: getDiscoveryStatistics
      tags: [discovery]
      summary: Get discovery statistics
      responses:
        "200":
          description: Discovery statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryStatistics"
  /discovery/guidance:
    get:
      operationId: getDiscoveryGuidance
      tags: [discovery]
      summary: Get discovery guidance
      responses:
        "200":
          description: Discovery guidance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryGuidance"
  /jobs/{jobId}/verify:
    post:
      operationId: verifyJobRequirements
      tags: [discovery]
      summary: Verify job requirements against user profile
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobVerificationResult"
  /jobs/{jobId}/match:
    post:
      operationId: matchJobToUser
      tags: [discovery]
      summary: Get enhanced match details for a job
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Match details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobMatchDetails"
  /integrations/gmail/connect:
    get:
      operationId: connectGmail
      tags: [integrations]
      summary: Start the read-only Gmail OAuth flow
      responses:
        "302": { description: Redirect to Google for authorization }
        "409": { description: Gmail OAuth client credentials are not configured }
  /integrations/gmail/callback:
    get:
      operationId: gmailOAuthCallback
      tags: [integrations]
      summary: Complete the read-only Gmail OAuth flow
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        "302": { description: Redirect to settings with the result }
        "400": { description: Invalid or expired OAuth state }
components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, minLength: 1 }
    AiProvider:
      in: path
      name: provider
      required: true
      schema: { type: string, enum: [openai, gemini, agentrouter, openrouter] }
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    AuthStatus:
      type: object
      properties:
        setupRequired: { type: boolean }
        authenticated: { type: boolean }
      required: [setupRequired, authenticated]
    AuthPasswordInput:
      type: object
      properties:
        password: { type: string, minLength: 12, maxLength: 256 }
      required: [password]
    DashboardActivity:
      type: object
      properties:
        id: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, message, createdAt]
    DashboardSummary:
      type: object
      properties:
        jobsDiscovered: { type: integer }
        newMatches: { type: integer }
        applicationsSubmitted: { type: integer }
        applicationsPending: { type: integer }
        interviews: { type: integer }
        offers: { type: integer }
        responseRate: { type: number }
        topMatchScore: { type: ["integer", "null"] }
        jobsAwaitingReview: { type: integer }
        agent: { $ref: "#/components/schemas/AgentStatus" }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/DashboardActivity" }
      required:
        - jobsDiscovered
        - newMatches
        - applicationsSubmitted
        - applicationsPending
        - interviews
        - offers
        - responseRate
        - topMatchScore
        - jobsAwaitingReview
        - agent
        - recentActivity
    JobStatus:
      type: string
      enum: [DISCOVERED, MATCHED, SHORTLISTED, REJECTED, IGNORED, NEEDS_REVIEW]
    Job:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        company: { type: string }
        location: { type: ["string", "null"] }
        remote: { type: boolean }
        salary: { type: ["string", "null"] }
        source: { type: string }
        sourceUrl: { type: ["string", "null"], format: uri }
        description: { type: string }
        matchScore: { type: ["integer", "null"], minimum: 0, maximum: 100 }
        status: { $ref: "#/components/schemas/JobStatus" }
        discoveredAt: { type: string, format: date-time }
      required: [id, title, company, location, remote, salary, source, sourceUrl, description, matchScore, status, discoveredAt]
    JobInput:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 240 }
        company: { type: string, minLength: 1, maxLength: 240 }
        location: { type: ["string", "null"], maxLength: 240 }
        remote: { type: boolean }
        salary: { type: ["string", "null"], maxLength: 240 }
        source: { type: string, minLength: 1, maxLength: 120 }
        sourceUrl: { type: ["string", "null"], format: uri }
        externalJobId: { type: ["string", "null"], maxLength: 500 }
        description: { type: string, minLength: 1, maxLength: 100000 }
      required: [title, company, location, remote, salary, source, sourceUrl, externalJobId, description]
    JobUpdate:
      type: object
      properties:
        status: { $ref: "#/components/schemas/JobStatus" }
      required: [status]
    DuplicateJob:
      type: object
      properties:
        error: { type: string }
        existingJobId: { type: string }
      required: [error, existingJobId]
    ApplicationStatus:
      type: string
      enum: [NEEDS_REVIEW, PREPARING, READY_TO_SUBMIT, SUBMITTED, EMAIL_SENT, AWAITING_RESPONSE, RECRUITER_RESPONSE, INTERVIEW, ASSESSMENT, OFFER, REJECTED, WITHDRAWN, BLOCKED]
    Application:
      type: object
      properties:
        id: { type: string }
        jobId: { type: string }
        jobTitle: { type: string }
        company: { type: string }
        appliedAt: { type: string, format: date-time }
        method: { type: string, enum: [manual, email, browser] }
        matchScore: { type: ["integer", "null"] }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        lastActivityAt: { type: string, format: date-time }
      required: [id, jobId, jobTitle, company, appliedAt, method, matchScore, status, lastActivityAt]
    TrackApplicationInput:
      type: object
      properties:
        method: { type: string, enum: [manual, email, browser] }
      required: [method]
    CandidateProfile:
      type: object
      properties:
        fullName: { type: string }
        email: { type: string }
        phone: { type: string }
        country: { type: string }
        city: { type: string }
        timezone: { type: string }
        targetRoles: { type: array, items: { type: string } }
        skills: { type: array, items: { type: string } }
        technologies: { type: array, items: { type: string } }
        yearsExperience: { type: ["number", "null"], minimum: 0 }
        education: { type: array, items: { type: string } }
        certifications: { type: array, items: { type: string } }
        industries: { type: array, items: { type: string } }
        languages: { type: array, items: { type: string } }
